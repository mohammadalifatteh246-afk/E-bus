<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-BUS - Update Profile</title>
  
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="app-container">
  
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">🚌 E-BUS</div>
    <nav class="sidebar-nav">
      <a href="home.html" class="nav-item">
        <span class="nav-icon">🏠</span> Home
      </a>
      <a href="book-ticket.html" class="nav-item">
        <span class="nav-icon">🎫</span> Book Ticket
      </a>
      <a href="my-passes.html" class="nav-item">
        <span class="nav-icon">🪪</span> My Passes
      </a>
      <a href="my-tickets.html" class="nav-item">
        <span class="nav-icon">🧾</span> My Tickets
      </a>
      <a href="profile.html" class="nav-item active">
        <span class="nav-icon">👤</span> Profile
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      </div>
      <div class="topbar-right">
        <div class="user-profile">
          <div class="user-avatar">MA</div>
          <div class="user-info">
            <span class="user-name">Mohammad Ali</span>
            <span class="user-role">Passenger</span>
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      
      <div class="mb-lg">
        <a href="profile.html" class="text-primary text-small mb-sm inline-block">← Back to Profile</a>
        <h1 class="page-title mb-0">Update Profile</h1>
      </div>

      <div class="card" style="max-width: 600px;">
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" value="Mohammad Ali">
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" value="m.ali@example.com">
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" value="+91 9876543210">
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Age</label>
              <input type="number" class="form-control" value="28">
            </div>
            <div class="form-group">
              <label class="form-label">Gender</label>
              <select class="form-control form-select">
                <option selected>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card-footer flex justify-end gap-sm">
          <a href="profile.html" class="btn btn-secondary">Cancel</a>
          <button class="btn btn-primary" onclick="ToastSystem.show('Success', 'Profile updated successfully.'); setTimeout(()=>window.location.href='profile.html', 1500)">Save Changes</button>
        </div>
      </div>

    </div>
  </main>

</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/toast.js"></script>
</body>
</html>
