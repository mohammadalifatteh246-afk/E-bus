<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-BUS - Settings</title>
  
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="app-container">
  
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">🚌 E-BUS</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">📊</span> Overview
      </a>
      <a href="routes.html" class="nav-item">
        <span class="nav-icon">🛣️</span> Routes
      </a>
      <a href="buses.html" class="nav-item">
        <span class="nav-icon">🚌</span> Buses
      </a>
      <a href="passes.html" class="nav-item">
        <span class="nav-icon">🪪</span> Passes
      </a>
      <a href="renewals.html" class="nav-item">
        <span class="nav-icon">🔄</span> Renewals
      </a>
      <a href="bookings.html" class="nav-item">
        <span class="nav-icon">🎫</span> Bookings
      </a>
      <a href="users.html" class="nav-item">
        <span class="nav-icon">👥</span> Users
      </a>
      <a href="reports.html" class="nav-item">
        <span class="nav-icon">📈</span> Reports
      </a>
      <a href="settings.html" class="nav-item active">
        <span class="nav-icon">⚙️</span> Settings
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      </div>
      <div class="topbar-right">
        <div class="user-profile">
          <div class="user-avatar" style="background-color: var(--navy); color: white;">AD</div>
          <div class="user-info">
            <span class="user-name">Admin</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      
      <div class="mb-lg">
        <h1 class="page-title">System Settings</h1>
      </div>

      <div class="grid-2" style="grid-template-columns: 1fr 2fr;">
        
        <div class="flex-col gap-sm">
          <a href="#" class="p-sm font-medium text-primary bg-light" style="background-color: var(--primary-light); border-radius: var(--radius-sm);">General Settings</a>
          <a href="#" class="p-sm text-secondary hover-primary">Fare Rules</a>
          <a href="#" class="p-sm text-secondary hover-primary">Email Templates</a>
          <a href="#" class="p-sm text-secondary hover-primary">Payment Gateway</a>
          <a href="#" class="p-sm text-secondary hover-primary">Admin Users</a>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title mb-0">General Settings</h3>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">System Name</label>
              <input type="text" class="form-control" value="E-BUS">
            </div>
            <div class="form-group">
              <label class="form-label">Support Email</label>
              <input type="email" class="form-control" value="support@ebus.com">
            </div>
            <div class="form-group">
              <label class="form-label">Support Phone</label>
              <input type="tel" class="form-control" value="1800-123-4567">
            </div>
            <div class="form-group">
              <label class="form-label">Maintenance Mode</label>
              <label class="form-check">
                <input type="checkbox" class="form-check-input">
                <span class="form-check-label">Enable Maintenance Mode (Disable passenger logins)</span>
              </label>
            </div>
          </div>
          <div class="card-footer text-right">
            <button class="btn btn-primary" onclick="ToastSystem.show('Saved', 'Settings have been updated.')">Save Changes</button>
          </div>
        </div>

      </div>

    </div>
  </main>

</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/toast.js"></script>
</body>
</html>
