<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-BUS - Register</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body style="background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="card p-xl" style="max-width: 400px; width: 100%; margin: var(--space-xl);">
    <div class="text-center mb-lg">
      <div style="font-size: 32px; margin-bottom: var(--space-sm);">🚌</div>
      <h2 class="font-bold mb-xs" style="font-size: 24px;">Create Account</h2>
      <p class="text-secondary text-small">Start your journey with E-BUS</p>
    </div>
    
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" placeholder="Enter email">
    </div>
    
    <div class="form-group mb-lg">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" placeholder="Create password">
    </div>

    <label class="form-check mb-lg">
      <input type="checkbox" class="form-check-input">
      <span class="form-check-label text-small text-secondary">I agree to the Terms of Service and Privacy Policy</span>
    </label>

    <button class="btn btn-primary w-full mb-md" onclick="window.location.href='login.html'" style="padding: 12px; font-size: 16px;">Sign Up</button>
    
    <div class="text-center text-small">
      <span class="text-secondary">Already have an account?</span>
      <a href="login.html" class="text-primary font-medium ml-xs">Log in</a>
    </div>
  </div>

</body>
</html>
